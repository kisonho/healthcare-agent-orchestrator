version: "3.9"

#
# Local docker-compose environment for running the Healthcare Agent Orchestrator
# against a locally hosted, OpenAI-compatible LLM.
#
# Usage:
#   1. Populate ./local.env (copy from ./local.env.example) with the Azure resources
#      that back the orchestrator (storage account, Bot IDs, etc.).
#   2. Download or prepare the GGUF/LLM artifacts under ./models for LocalAI (or
#      adjust the local-llm service to point at another OpenAI-compatible server).
#   3. Start the stack:  docker compose -f local.yaml up --build
#   4. API will be available at http://localhost:8000 and the LLM at http://localhost:8001.
#

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
        NODE_VERSION: ${NODE_VERSION:-20}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    env_file:
      - ./local.env
    environment:
      # Switch Semantic Kernel to the local connector.
      LLM_PROVIDER: local
      LOCAL_LLM_MODEL_ID: ${LOCAL_LLM_MODEL_ID:-local-model}
      LOCAL_LLM_ENDPOINT: ${LOCAL_LLM_ENDPOINT:-http://local-llm:8080/v1/chat/completions}
      LOCAL_LLM_AUTOGEN_BASE_URL: ${LOCAL_LLM_AUTOGEN_BASE_URL:-http://local-llm:8080}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      LOCAL_LLM_HEADERS: ${LOCAL_LLM_HEADERS:-}
      LOCAL_LLM_VERIFY_SSL: ${LOCAL_LLM_VERIFY_SSL:-false}
      BACKEND_APP_HOSTNAME: ${BACKEND_APP_HOSTNAME:-http://localhost:8000}
      SCENARIO: ${SCENARIO:-default}
    depends_on:
      local-llm:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Share Azure CLI credentials from the host so AzureCliCredential can authenticate.
      # Set AZURE_CONFIG_DIR_HOST in local.env to the absolute host path (e.g. C:\Users\<user>\.azure on Windows).
      - ${AZURE_CONFIG_DIR_HOST:?Set AZURE_CONFIG_DIR_HOST in local.env to your Azure CLI configuration folder}:/root/.azure

  local-llm:
    image: localai/localai:latest
    environment:
      - MODELS_PATH=/models
      - THREADS=${LOCAL_LLM_THREADS:-4}
      - CONTEXT_SIZE=${LOCAL_LLM_CONTEXT_SIZE:-4096}
    volumes:
      - ./models:/models
    ports:
      - "8001:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
