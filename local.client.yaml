#
# Run the React demo client against a locally running orchestrator instance.
#
# Start the backend/LLM stack first (docker compose -f local.yaml up),
# then launch this compose file to serve the Vite dev server on http://localhost:3000.
#

services:
  demo-client:
    image: node:20-bookworm
    working_dir: /workspace
    volumes:
      - ./democlient:/workspace
      - node_modules_cache:/workspace/node_modules
      - npm_cache:/root/.npm
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://host.docker.internal:8000/api}
    command: >
      sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000 --open false"
    ports:
      - "3000:3000"
    tty: true

volumes:
  node_modules_cache:
  npm_cache:
